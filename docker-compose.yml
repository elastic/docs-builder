services:
  # Run a one-shot CLI command, for example:
  #   docker compose run --rm docs-builder
  #   docker compose run --rm docs-builder inbound-links validate-link-reference
  docs-builder:
    build:
      context: .
    image: docs-builder:local
    working_dir: /workspace
    volumes:
      - .:/workspace

  # Run the repository's unit-test suite without installing the .NET SDK on
  # the host machine.
  tests:
    build:
      context: .
      target: tooling
    image: docs-builder:tooling
    working_dir: /src
    command: ["./build.sh", "unit-test"]
    volumes:
      - .:/src

  # Build the current documentation set and keep it refreshed while files
  # change. Open http://localhost:3000 after starting this service.
  serve:
    build:
      context: .
    image: docs-builder:local
    working_dir: /workspace
    command: ["serve", "--port", "3000"]
    environment:
      DOCS_BUILDER_BIND_ADDRESS: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/workspace
