self-hosted-runner:
  labels:
    - docs-builder-latest-16
    - docs-internal-latest-16

paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # actionlint does not support the `$/` self-repository syntax yet: https://github.com/rhysd/actionlint/issues/711
      - 'specifying action "\$/.+" in invalid format because ref is missing'
      - 'reusable workflow call "\$/.+" at "uses" is not following the format'
  .github/workflows/pr-review.yml:
    ignore:
      # copilot-requests is a valid GitHub permission scope not yet known to actionlint.
      - 'unknown permission scope "copilot-requests"'
  .github/workflows/ci.yml:
    ignore:
      # integration job is temporarily disabled on purpose (see TODO in the workflow).
      - 'constant expression "false" in condition'
