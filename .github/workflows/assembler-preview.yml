name: assembler-preview

on:
  pull_request: ~
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number to build the assembler preview for'
        required: true
        type: string

permissions: {}

concurrency:
  group: assembler-preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: [changes]
    permissions:
      contents: read
      deployments: write
      id-token: write
      pull-requests: read
    if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: docs-internal-latest-16
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      ASSEMBLER_PREVIEW_PATH_PREFIX: ${{ github.repository }}/docs/${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Get PR details
        if: github.event_name == 'workflow_dispatch'
        id: pr-details
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const prNumber = parseInt(process.env.PR_NUMBER, 10);

            if (isNaN(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid PR number: ${process.env.PR_NUMBER}`);
              return;
            }

            try {
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              return pr.head.sha;
            } catch (error) {
              core.setFailed(`Failed to get PR #${prNumber}: ${error.message}`);
            }

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr-details.outputs.result || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Create Deployment
        id: deployment
        uses: $/.github/actions/deployment-start
        with:
          environment: assembler-preview
          task: assembler-preview-${{ env.PR_NUMBER }}
          ref: ${{ steps.pr-details.outputs.result || github.event.pull_request.head.sha }}

      - name: Bootstrap Action Workspace
        uses: elastic/docs-builder/.github/actions/bootstrap@main

      - name: Build assembled documentation
        run: |
          yq -i ".environments.preview.path_prefix = \"${ASSEMBLER_PREVIEW_PATH_PREFIX}\"" config/assembler.yml
          dotnet run --project src/tooling/docs-builder -- assemble --skip-private-repositories --environment preview

      - uses: elastic/docs-builder/.github/actions/aws-auth@main

      - name: Configure S3 transfer
        env:
          AWS_S3_MAX_CONCURRENT_REQUESTS: 50
          AWS_S3_MAX_QUEUE_SIZE: 20000
        run: |
          aws configure set default.s3.preferred_transfer_client classic
          aws configure set default.s3.max_concurrent_requests "${AWS_S3_MAX_CONCURRENT_REQUESTS}"
          aws configure set default.s3.max_queue_size "${AWS_S3_MAX_QUEUE_SIZE}"

      - name: Upload assembled docs to S3
        id: s3-upload
        uses: $/.github/actions/upload-preview
        with:
          source: .artifacts/assembly/${{ env.ASSEMBLER_PREVIEW_PATH_PREFIX }}
          path-prefix: /${{ env.ASSEMBLER_PREVIEW_PATH_PREFIX }}

      - name: Install frontend dependencies
        working-directory: src/Elastic.Documentation.Site
        run: npm ci

      - name: Wait for preview to be live
        run: |
          for i in $(seq 1 18); do
            if curl -sf -L --max-time 15 "https://docs-v3-preview.elastic.dev/${ASSEMBLER_PREVIEW_PATH_PREFIX}" -o /dev/null; then
              echo "Preview is live after attempt $i"
              break
            fi
            echo "Attempt $i: not ready, retrying in 10s…"
            sleep 10
          done

      - name: Run synthetics
        id: synthetics
        working-directory: src/Elastic.Documentation.Site
        env:
          DOCS_ENV: preview
          DOCS_PREVIEW_BASE_URL: https://docs-v3-preview.elastic.dev/${{ env.ASSEMBLER_PREVIEW_PATH_PREFIX }}
        run: npm run synthetics:test:preview

      - name: Run accessibility synthetics
        id: synthetics-accessibility
        working-directory: src/Elastic.Documentation.Site
        env:
          DOCS_ENV: preview
          DOCS_PREVIEW_BASE_URL: https://docs-v3-preview.elastic.dev/${{ env.ASSEMBLER_PREVIEW_PATH_PREFIX }}
        run: npm run synthetics:test:accessibility

      - name: Update Deployment Status
        if: always() && steps.deployment.outputs.id
        uses: $/.github/actions/deployment-finish
        with:
          deployment-id: ${{ steps.deployment.outputs.id }}
          state: ${{ steps.s3-upload.outcome == 'success' && steps.synthetics.outcome != 'failure' && steps.synthetics-accessibility.outcome != 'failure' && 'success' || 'failure' }}
          environment-url: https://docs-v3-preview.elastic.dev/${{ env.ASSEMBLER_PREVIEW_PATH_PREFIX }}
