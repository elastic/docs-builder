name: assembler-preview-cleanup

on:
  workflow_call: ~
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  destroy:
    if: github.event.repository.fork == false # Skip running the job on the fork itself (It still runs on PRs on the upstream from forks)
    permissions:
      contents: none
      deployments: write
      id-token: write
    uses: $/.github/workflows/preview-cleanup.yml
    cache-mode: none
    with:
      environment: assembler-preview
      s3-folder: docs
