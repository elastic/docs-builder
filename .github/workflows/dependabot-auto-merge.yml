name: dependabot-auto-merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

jobs:
  auto-merge:
    # Check the PR author rather than github.actor, which can be spoofed by re-runs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # For grouped PRs update-type is the highest across the group, so this only
      # matches PRs where every dependency is a minor or patch bump. Auto-merge waits
      # for required checks to pass. dotnet-sdk and docker updates stay manual.
      - name: Approve and enable auto-merge for minor and patch updates
        if: >-
          contains(fromJSON('["npm_and_yarn", "nuget", "github_actions"]'), steps.metadata.outputs.package-ecosystem)
          && contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type)
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
