name: Release

on:
  workflow_dispatch: 
    
permissions: {}

concurrency:
  group: release-drafter

jobs:
  
  release-drafter:
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch
        run: |
          if [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "This workflow is only allowed to run on the main branch."
            exit 1
          fi
      - uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        id: release-drafter
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          commitish: ${{ github.sha }}
      - name: Create tag
        uses: actions/github-script@v9
        with:
          script: | # zizmor: ignore[template-injection] tag_name from release-drafter on main
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/tags/${{ steps.release-drafter.outputs.tag_name }}',
              sha: context.sha
            })
  
  containers:
    needs: 
      - release-drafter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for `actions/attest-build-provenance`
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      full-version: ${{ steps.bootstrap.outputs.full-version }}
      major-version: ${{ steps.bootstrap.outputs.major-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-drafter.outputs.tag_name }}
          persist-credentials: false
      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/actions/bootstrap

      - name: Restore npm dependencies
        working-directory: src/Elastic.Documentation.Site
        run: npm ci

      - name: Check shai-hulud supply-chain hashes
        uses: ./.github/actions/check-shai-hulud
        with:
          path: src/Elastic.Documentation.Site

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Containers
        run: ./build.sh publishcontainers

      # Resolve the manifest digest of each pushed image so we can
      # mint a signed attestation against the immutable digest. The
      # release version tag (e.g., :v1.4.0) is the canonical reference
      # but we attest against the digest because tags can be moved.
      # Consumers verify with:
      #   gh attestation verify oci://ghcr.io/elastic/docs-builder@<digest> \
      #     -R elastic/docs-builder
      - name: Resolve pushed image digests
        id: digests
        env:
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
        # language=bash
        run: |
          set -euo pipefail
          for image in docs-builder docs-builder-mcp docs-builder-api; do
            ref="ghcr.io/elastic/${image}:${TAG_NAME}"
            digest=$(docker buildx imagetools inspect "$ref" 2>/dev/null \
              | awk '/^Digest:/ {print $2; exit}')
            if [ -z "$digest" ]; then
              echo "::error::Could not resolve manifest digest for ${ref}"
              exit 1
            fi
            echo "${image}=${digest}" >> "$GITHUB_OUTPUT"
            echo "Resolved ${ref} -> ${digest}"
          done

      - name: Attest docs-builder image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/elastic/docs-builder
          subject-digest: ${{ steps.digests.outputs.docs-builder }}
          push-to-registry: true

      - name: Attest docs-builder-mcp image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/elastic/docs-builder-mcp
          subject-digest: ${{ steps.digests.outputs.docs-builder-mcp }}
          push-to-registry: true

      - name: Attest docs-builder-api image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/elastic/docs-builder-api
          subject-digest: ${{ steps.digests.outputs.docs-builder-api }}
          push-to-registry: true
        
  build-link-index-lambda:
    permissions: 
      contents: read
    needs: 
      - release-drafter
    uses: ./.github/workflows/build-link-index-updater-lambda.yml
    with:
      ref: ${{ needs.release-drafter.outputs.tag_name }}

  build-changelog-scrubber-lambda:
    permissions:
      contents: read
    needs:
      - release-drafter
    uses: ./.github/workflows/build-changelog-scrubber-lambda.yml
    with:
      ref: ${{ needs.release-drafter.outputs.tag_name }}

  build-openapi-index-lambda:
    permissions:
      contents: read
    needs:
      - release-drafter
    uses: ./.github/workflows/build-openapi-index-lambda.yml
    with:
      ref: ${{ needs.release-drafter.outputs.tag_name }}

  package-openapi-index-updater-lambda:
    runs-on: ubuntu-latest
    needs:
      - build-openapi-index-lambda
      - release-drafter
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      ZIP_FILE: openapi-index-updater-lambda.zip
    steps:
      - name: Download bootstrap binary
        uses: actions/download-artifact@v8
        with:
          name: openapi-index-updater-lambda-binary

      - name: Create zip
        run: |
          zip -j "${ZIP_FILE}" ./bootstrap

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: openapi-index-updater-lambda.zip

      - name: Attach distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload --repo "$REPO" "$TAG_NAME" "${ZIP_FILE}"

  deploy-link-index-updater-lambda-prod:
    environment: 
      name: link-index-updater-prod
    runs-on: ubuntu-latest
    needs:
      - build-link-index-lambda
      - release-drafter
    permissions:
      contents: write
      id-token: write
    env: 
      ZIP_FILE: link-index-updater-lambda.zip
    steps:

      - name: Download bootstrap binary
        uses: actions/download-artifact@v8
        with: 
          name: link-index-updater-lambda-binary

      - name: Create zip
        run: |
          zip -j "${ZIP_FILE}" ./bootstrap

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::197730964718:role/elastic-docs-v3-link-index-updater-deployer
          aws-region: us-east-2
      
      - name: Upload Lambda function
        run: |
          aws lambda update-function-code \
            --function-name elastic-docs-v3-link-index-updater \
            --zip-file "fileb://${ZIP_FILE}"
      
      - name: Attach Distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload --repo "$REPO" "$TAG_NAME" "${ZIP_FILE}"

  deploy-changelog-scrubber-lambda-prod:
    environment:
      name: changelog-scrubber-prod
    runs-on: ubuntu-latest
    needs:
      - build-changelog-scrubber-lambda
      - release-drafter
    permissions:
      contents: write
      id-token: write
    env:
      ZIP_FILE: changelog-scrubber-lambda.zip
    steps:

      - name: Download bootstrap binary
        uses: actions/download-artifact@v8
        with:
          name: changelog-scrubber-lambda-binary

      - name: Download allowlist identity
        uses: actions/download-artifact@v8
        with:
          name: changelog-scrubber-allowlist-identity

      - name: Create zip
        run: |
          zip -j "${ZIP_FILE}" ./bootstrap

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::197730964718:role/elastic-docs-v3-changelog-scrubber-deployer
          aws-region: us-east-1

      - name: Upload Lambda function
        run: |
          aws lambda update-function-code \
            --function-name elastic-docs-v3-changelog-scrubber \
            --zip-file "fileb://${ZIP_FILE}"

      # The allowlist identity is attached only after update-function-code succeeded, so the
      # presence of this asset on a release attests that the release's allowlist was deployed.
      # Consumers resolve the deployed identity from the newest release carrying the asset
      # (`docs-builder changelog scrubber-allowlist`, docs-eng-team#671).
      - name: Attach Distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: gh release upload --repo "$REPO" "$TAG_NAME" "${ZIP_FILE}" changelog-scrubber-allowlist.json

  release:
    needs: 
      - release-drafter
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-latest-large ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    outputs:
      full-version: ${{ steps.bootstrap.outputs.full-version }}
      major-version: ${{ steps.bootstrap.outputs.major-version }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-drafter.outputs.tag_name }}
          persist-credentials: false
      - name: 'Windows only, set TEMP to the same drive'
        if: ${{ matrix.os == 'windows-latest' }}
        #  temporary waiting for https://github.com/parcel-bundler/parcel/pull/10095 to fix
        run: |
          mkdir "D:\\Temp"
          echo "TEMP=D:\\Temp" >> $env:GITHUB_ENV

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: ./.github/actions/bootstrap

      - name: Publish Binaries
        run: ./build.sh publishzip
        shell: bash
        
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            .artifacts/publish/docs-builder/release/*.zip

      - name: Attach Distribution to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" .artifacts/publish/docs-builder/release/*.zip
        shell: bash

  publish-release:
    needs:
      - release
      - containers
      - release-drafter
      - deploy-link-index-updater-lambda-prod
      - deploy-changelog-scrubber-lambda-prod
      - package-openapi-index-updater-lambda
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG_NAME" --draft=false --latest --repo "$REPO"

      - name: Fetch ephemeral GitHub token
        id: fetch-ephemeral-token
        uses: elastic/ci-gh-actions/fetch-github-token@v1
        with:
          vault-instance: "ci-prod"

      - name: Notify docs-internal-workflows
        env:
          GH_TOKEN: ${{ steps.fetch-ephemeral-token.outputs.token }}
          TAG_NAME: ${{ needs.release-drafter.outputs.tag_name }}
        run: |
          gh api repos/elastic/docs-internal-workflows/dispatches \
            -f event_type=docs-builder-released \
            -F client_payload[tag_name]="$TAG_NAME"

  notify-failure:
    needs:
      - release-drafter
      - containers
      - build-link-index-lambda
      - build-changelog-scrubber-lambda
      - build-openapi-index-lambda
      - package-openapi-index-updater-lambda
      - deploy-link-index-updater-lambda-prod
      - deploy-changelog-scrubber-lambda-prod
      - release
      - publish-release
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-slim
    permissions:
      id-token: write
    steps:
      - uses: elastic/docs-actions/slack/notify-status@v1
        with:
          channel: docs-alerts
          status: failure
          mention: S028C66K5EX
          description: Release failed. Containers, binaries, Lambda deploys, or publish did not complete.
