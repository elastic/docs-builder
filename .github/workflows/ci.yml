name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate-assembler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: $/.github/actions/bootstrap

      - name: Validate Navigation
        run: dotnet run --project src/tooling/docs-builder -c release -- assembler navigation validate

      - name: Validate Content Sources
        run: dotnet run --project src/tooling/docs-builder -c release -- assembler content-source validate

  # The lambda Docker builds are slow and only depend on a handful of projects, so on PRs
  # only run them when their transitive project references (or shared build inputs) change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      link-index-lambda: ${{ steps.filter.outputs.link-index-lambda }}
      openapi-index-lambda: ${{ steps.filter.outputs.openapi-index-lambda }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # pull_request checks out the merge commit: HEAD^1 is the base branch tip
          fetch-depth: 2

      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "link-index-lambda=true" >> "$GITHUB_OUTPUT"
            echo "openapi-index-lambda=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^1 HEAD > changed.txt
          cat changed.txt
          shared='^(global\.json|Directory\.(Build|Packages)\.props|src/Directory\.Build\.props|\.github/workflows/ci\.yml)$'
          link_index='^(src/infra/docs-lambda-index-publisher/|src/Elastic\.Documentation/|src/Elastic\.Documentation\.(Configuration|LinkIndex|Tooling)/|src/services/search/Elastic\.Documentation\.Search\.Contract/|config/|\.github/workflows/build-link-index-updater-lambda\.yml$)'
          openapi_index='^(src/infra/docs-lambda-openapi-index/|src/Elastic\.Documentation\.OpenApiIndex/|\.github/workflows/build-openapi-index-lambda\.yml$)'
          matches() { grep -Eq -e "$shared" -e "$1" changed.txt && echo true || echo false; }
          echo "link-index-lambda=$(matches "$link_index")" >> "$GITHUB_OUTPUT"
          echo "openapi-index-lambda=$(matches "$openapi_index")" >> "$GITHUB_OUTPUT"

  build-link-index-updater-lambda:
    needs: [changes]
    if: ${{ needs.changes.outputs.link-index-lambda == 'true' }}
    uses: $/.github/workflows/build-link-index-updater-lambda.yml

  build-openapi-index-lambda:
    needs: [changes]
    if: ${{ needs.changes.outputs.openapi-index-lambda == 'true' }}
    uses: $/.github/workflows/build-openapi-index-lambda.yml

  npm:
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: src/Elastic.Documentation.Site
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7.1.0
        with:
          cache: npm
          cache-dependency-path: src/Elastic.Documentation.Site/package-lock.json
          node-version-file: .nvmrc
      
      - name: Install dependencies
        run: npm ci

      - name: Check shai-hulud attack
        uses: $/.github/actions/check-shai-hulud
        with:
          path: src/Elastic.Documentation.Site

      - name: Lint
        run: npm run lint
      
      - name: Format
        run: npm run fmt:check
      
      - name: Compile
        run: npm run compile:check
        
      - name: Build
        run: npm run build
        
      - name: Test
        run: npm run test
      

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Lint
        uses: nullean/curb@747187f178444c46e0098a9e50241b523bf7b9f8 # 0.8.1
        with:
          command: check
          path: .

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
         - ubuntu-latest
         - macos-latest
         - windows-latest
    steps:          
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: $/.github/actions/bootstrap

      - name: Compile
        run: dotnet run --project build -c release -- compile

      - name: Check CLI schema is up to date
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          dotnet run --project src/tooling/docs-builder -c release --no-build -- __schema > docs/cli-schema.json.tmp
          diff <(jq 'del(.version)' docs/cli-schema.json) <(jq 'del(.version)' docs/cli-schema.json.tmp) || (echo "docs/cli-schema.json is out of date — run: dotnet run --project src/tooling/docs-builder -- __schema > docs/cli-schema.json" && exit 1)
          rm docs/cli-schema.json.tmp

      - name: Test
        run: dotnet run --project build -c release -- unit-test

      - name: Publish AOT
        if: ${{ github.event_name == 'push' && matrix.os != 'ubuntu-latest' }} # publish containers already validates AOT build
        run: dotnet run --project build -c release -- publishbinaries

      - name: Publish Containers
        if: ${{ github.event_name == 'push' && matrix.os == 'ubuntu-latest' }}
        env:
          DOCKER_NO_PUBLISH: true
        run: dotnet run --project build -c release -- publishcontainers

      - name: Run Container
        if: ${{ github.event_name == 'push' && matrix.os == 'ubuntu-latest' }}
        run: dotnet run --project build -c release -- runlocalcontainer
        

  integration:
    # TODO temporarily disabled: credentials now actually reach the tests (Parameters:-prefixed
    # secrets) which surfaced failures — re-enabling is tracked in a dedicated PR.
    if: false
    runs-on: docs-builder-latest-16
    environment: integration-tests
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Bootstrap Action Workspace
        id: bootstrap
        uses: $/.github/actions/bootstrap

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::197730964718:role/elastic-docs-v3-integration-tests
          aws-region: us-east-1

      - name: Fetch ES credentials
        run: |
          ES_URL=$(aws ssm get-parameter --name /elastic-docs-v3/prod/docs-elasticsearch-github-actions-readonly-url --with-decryption --query Parameter.Value --output text)
          ES_KEY=$(aws ssm get-parameter --name /elastic-docs-v3/prod/docs-elasticsearch-github-actions-readonly-api-key --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$ES_URL"
          echo "::add-mask::$ES_KEY"
          dotnet tool restore
          dotnet aspire secret set ElasticsearchUrl "$ES_URL"
          dotnet aspire secret set ElasticsearchApiKey "$ES_KEY"

      - name: Integration Tests
        env:
          ENVIRONMENT: prod
        run: dotnet run --project build -c release -- integrate
