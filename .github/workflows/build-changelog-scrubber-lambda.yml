---
# This workflow builds the changelog-scrubber Lambda function bootstrap binary
# that can be deployed to AWS Lambda.
name: Build Changelog Scrubber Lambda

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        default: ${{ github.ref }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BINARY_PATH: .artifacts/docs-lambda-changelog-scrubber/release_linux-x64/bootstrap
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Amazon Linux 2023 build
        run: |
          docker build . -t changelog-scrubber:latest -f src/infra/docs-lambda-changelog-scrubber/lambda.DockerFile
      - name: Get bootstrap binary
        run: |
          docker cp "$(docker create --name tc changelog-scrubber:latest)":/app/.artifacts/publish ./.artifacts && docker rm tc
      - name: Inspect bootstrap binary
        run: |
          tree .artifacts
          stat "${BINARY_PATH}"
      - name: Archive artifact
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: changelog-scrubber-lambda-binary
          retention-days: 1
          if-no-files-found: error
          path: ${{ env.BINARY_PATH }}
      # The scrubber's link allowlist is embedded from config/assembler.yml at this ref, so this
      # hash identifies exactly which allowlist the deployed Lambda runs with. The release workflow
      # attaches the document to the GitHub release after a successful deploy, making the deployed
      # identity observable (docs-eng-team#671).
      - name: Compute allowlist identity
        env:
          GIT_REF: ${{ inputs.ref || github.ref }}
        # language=bash
        run: |
          set -euo pipefail
          sha="sha256:$(sha256sum config/assembler.yml | awk '{print $1}')"
          commit="$(git rev-parse HEAD)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg sha "$sha" \
            --arg commit "$commit" \
            --arg ref "$GIT_REF" \
            --arg built_at "$built_at" \
            '{schema_version: 1, artifact: "scrubber-allowlist-identity", allowlist_sha256: $sha, deployment_commit: $commit, git_ref: $ref, built_at: $built_at}' \
            > changelog-scrubber-allowlist.json
          cat changelog-scrubber-allowlist.json
      - name: Archive allowlist identity
        uses: actions/upload-artifact@v7
        with:
          name: changelog-scrubber-allowlist-identity
          retention-days: 1
          if-no-files-found: error
          path: changelog-scrubber-allowlist.json
