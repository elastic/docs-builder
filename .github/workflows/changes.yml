name: changes

# Decides which slow work a pull request needs. Pushes and manual runs always report true for everything.
# - code: anything beyond repository metadata (.libra/, CODEOWNERS, ...) changed, so builds and previews run
# - link-index-lambda / openapi-index-lambda: the lambda's transitive project references or shared build inputs changed
# - dotnet: .NET code, build inputs or test fixtures changed, so Windows and macOS run the unit tests
#   (Linux runs them on every PR)
# - frontend-toolchain: npm dependencies or the Vite/Tailwind config changed, so Windows and macOS build the
#   frontend natively instead of reusing the `frontend` job's output. Native npm packages (esbuild, rolldown,
#   lightningcss, tailwind oxide) can break on one OS only.
#
# Matrix jobs that are required checks must gate per step instead of per job: a matrix job skipped
# by `if` keeps its unexpanded name (e.g. `build (${{ matrix.os }})`), so the required check never reports.

on:
  workflow_call:
    outputs:
      code:
        description: "'true' unless every changed file is repository metadata that cannot affect a build"
        value: ${{ jobs.filter.outputs.code }}
      link-index-lambda:
        description: "'true' when the link index updater lambda needs a build"
        value: ${{ jobs.filter.outputs.link-index-lambda }}
      openapi-index-lambda:
        description: "'true' when the OpenAPI index lambda needs a build"
        value: ${{ jobs.filter.outputs.openapi-index-lambda }}
      dotnet:
        description: "'true' when .NET code, build inputs or test fixtures changed"
        value: ${{ jobs.filter.outputs.dotnet }}
      frontend-toolchain:
        description: "'true' when npm dependencies or the frontend build config changed"
        value: ${{ jobs.filter.outputs.frontend-toolchain }}

permissions: {}

jobs:
  filter:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.result.outputs.code }}
      link-index-lambda: ${{ steps.result.outputs.link-index-lambda }}
      openapi-index-lambda: ${{ steps.result.outputs.openapi-index-lambda }}
      dotnet: ${{ steps.result.outputs.dotnet }}
      frontend-toolchain: ${{ steps.result.outputs.frontend-toolchain }}
    steps:
      # On pull_request the action reads the diff from the GitHub API, so no checkout is needed.
      # `any_modified` also counts deleted files, which `any_changed` does not. Renames are split into a
      # deletion and an addition so a file moved out of a filtered path still counts.
      - id: files
        if: ${{ github.event_name == 'pull_request' }}
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          output_renamed_files_as_deleted_and_added: true
          files_yaml: |
            code:
              - '**'
              # Bot/review config, ownership and issue templates. Workflows and actions are deliberately not listed.
              - '!.libra/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/updatecli/**'
              - '!.github/CODEOWNERS'
              - '!.github/copilot-instructions.md'
              - '!.github/dependabot.yml'
              - '!.github/release-drafter.yml'
              - '!.github/zizmor.yml'
              - '!.github/actionlint.yaml'
              - '!CODEOWNERS'
              - '!README.md'
            link_index_lambda:
              - global.json
              - Directory.Build.props
              - Directory.Packages.props
              - src/Directory.Build.props
              - .dockerignore
              - .github/workflows/ci.yml
              - .github/workflows/changes.yml
              - .github/workflows/build-link-index-updater-lambda.yml
              - src/infra/docs-lambda-index-publisher/**
              - src/Elastic.Documentation/**
              - src/Elastic.Documentation.Configuration/**
              - src/Elastic.Documentation.LinkIndex/**
              - src/Elastic.Documentation.Tooling/**
              - src/services/search/Elastic.Documentation.Search.Contract/**
              - config/**
            openapi_index_lambda:
              - global.json
              - Directory.Build.props
              - Directory.Packages.props
              - src/Directory.Build.props
              - .dockerignore
              - .github/workflows/ci.yml
              - .github/workflows/changes.yml
              - .github/workflows/build-openapi-index-lambda.yml
              - src/infra/docs-lambda-openapi-index/**
              - src/Elastic.Documentation.OpenApiIndex/**
            dotnet:
              - '**/*.{cs,fs,fsx,csproj,fsproj,props,targets,cshtml,razor,resx,slnx}'
              - global.json
              - dotnet-tools.json
              - tests/**
              - build/**
              - .github/workflows/ci.yml
              - .github/workflows/changes.yml
              - .github/actions/bootstrap/**
            frontend_toolchain:
              - .nvmrc
              - src/Elastic.Documentation.Site/package.json
              - src/Elastic.Documentation.Site/package-lock.json
              - src/Elastic.Documentation.Site/vite.config.ts
              - src/Elastic.Documentation.Site/tailwind.config.js

      - id: result
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          CODE: ${{ steps.files.outputs.code_any_modified }}
          LINK_INDEX_LAMBDA: ${{ steps.files.outputs.link_index_lambda_any_modified }}
          OPENAPI_INDEX_LAMBDA: ${{ steps.files.outputs.openapi_index_lambda_any_modified }}
          DOTNET: ${{ steps.files.outputs.dotnet_any_modified }}
          FRONTEND_TOOLCHAIN: ${{ steps.files.outputs.frontend_toolchain_any_modified }}
        run: |
          pick() { [ "$IS_PR" = "true" ] && echo "${1:-false}" || echo true; }
          {
            echo "code=$(pick "$CODE")"
            echo "link-index-lambda=$(pick "$LINK_INDEX_LAMBDA")"
            echo "openapi-index-lambda=$(pick "$OPENAPI_INDEX_LAMBDA")"
            echo "dotnet=$(pick "$DOTNET")"
            echo "frontend-toolchain=$(pick "$FRONTEND_TOOLCHAIN")"
          } | tee -a "$GITHUB_OUTPUT"
