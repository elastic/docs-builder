name: Bug Report
description: Something is broken or producing wrong output.
labels: ["bug", "needs triage"]
projects: ["elastic/1625"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: >
        What did you see? Include the command you ran and the exact output or error.
        Expected behaviour is welcome too — one field is easier than two.
      placeholder: |
        I ran `docs-builder build` against a docset with a cross-repo link. The build
        succeeded but the link resolved to a 404. I expected it to fail the build or
        produce a working URL.

        Error output:
        ```
        <paste here>
        ```
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How can we reproduce it?
      description: >
        Minimal steps or a command plus the file it ran against.
        Skip this if "What happened?" already covers it.
      placeholder: |
        ```bash
        docs-builder build --path-prefix /docs
        ```
        Using `_docset.yml` with `cross_links: [elasticsearch]` and an `xref:` to a
        missing anchor.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: >
        Output of `docs-builder --version`, or the commit SHA if building from source.
        This is the most useful piece of triage data.
      placeholder: "0.11.0 / abc1234"
    validations:
      required: false
