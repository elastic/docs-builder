name: Feature Request
description: Something is missing or could work better.
labels: ["enhancement", "needs triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is getting in your way?
      description: >
        The concrete limitation. What are you trying to do, and what stops you?
      placeholder: |
        I maintain a docset that builds with `docs-builder build` and a second one that
        builds with the assembler. When I run link validation locally, it only checks
        links within the current docset — I cannot catch broken cross-repo references
        before pushing.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like instead?
      description: >
        Your proposed change or outcome. A clear outcome is enough — a specific
        implementation is welcome but not required.
      placeholder: |
        A `--check-cross-links` flag for `docs-builder build` that resolves xref: links
        against a local clone of the referenced repo (or a cached link index) and fails
        the build when any resolve to a missing anchor.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: >
        Examples from other tools, links, screenshots, or context that did not fit above.
      placeholder: |
        MkDocs's `--strict` flag gives a similar signal for internal links. The Elastic
        link index at https://... might already have the data needed to do this.
    validations:
      required: false
