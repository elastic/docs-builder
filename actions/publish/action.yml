name: 'Documentation Publisher'
description: 'Builds and publishes documentation to github pages'

branding:
  icon: 'filter'
  color: 'red'

outputs:
  page_url:
    description: "The github actions url"
    value: ${{ steps.deployment.outputs.page_url || steps.deployment-retry-1.outputs.page_url || steps.deployment-retry-2.outputs.page_url || steps.deployment-retry-3.outputs.page_url }}

inputs:
  strict:
    description: 'Treat warnings as errors'
    required: false
  continue-on-error:
    description: 'Do not fail to publish if build fails'
    required: false
    default: "false"
  private:
    description: 'Publishing from a private repository'
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - id: repo-basename
      if: ${{ inputs.private == 'false' }}
      shell: bash
      run: 'echo "value=`basename ${{ github.repository }}`" >> $GITHUB_OUTPUT'

    - name: Build public documentation
      if: ${{ inputs.private == 'false' }}
      uses: elastic/docs-builder@main
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
      with:
        prefix: '${{ steps.repo-basename.outputs.value }}'
        strict: ${{ inputs.strict }}

    - name: Build private documentation
      if: ${{ inputs.private != 'false' }}
      uses: elastic/docs-builder@main
      continue-on-error: ${{ inputs.continue-on-error == 'true' }}
      with:
        strict: ${{ inputs.strict }}

    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v6.0.0
    - name: List Documentation
      shell: bash
      run: 'ls .artifacts/docs/html'
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: .artifacts/docs/html
    # actions/deploy-pages can miss the artifact right after the upload (actions/deploy-pages#451).
    # Upload once and retry only the deploy; remove the retries once the upstream fix (#455) is released.
    - name: Deploy artifact
      id: deployment
      uses: actions/deploy-pages@v5.0.1
      continue-on-error: true
    - name: Wait before deploy retry 1
      if: steps.deployment.outcome == 'failure'
      shell: bash
      run: sleep 5
    - name: Deploy artifact (retry 1)
      id: deployment-retry-1
      if: steps.deployment.outcome == 'failure'
      uses: actions/deploy-pages@v5.0.1
      continue-on-error: true
    - name: Wait before deploy retry 2
      if: steps.deployment-retry-1.outcome == 'failure'
      shell: bash
      run: sleep 20
    - name: Deploy artifact (retry 2)
      id: deployment-retry-2
      if: steps.deployment-retry-1.outcome == 'failure'
      uses: actions/deploy-pages@v5.0.1
      continue-on-error: true
    - name: Wait before deploy retry 3
      if: steps.deployment-retry-2.outcome == 'failure'
      shell: bash
      run: sleep 60
    - name: Deploy artifact (retry 3)
      id: deployment-retry-3
      if: steps.deployment-retry-2.outcome == 'failure'
      uses: actions/deploy-pages@v5.0.1
