name: Update Link Index

description: |
  This action updates the link index for the given link reference file.

inputs:
  link_reference_file:
    description: 'The path to the link reference file'
    required: false
    default: '.artifacts/docs/html/links.json'
  aws_account_id:
    description: 'The AWS account ID to generate the role ARN for'
    required: false
    default: '197730964718' # elastic-web
  aws_region:
    description: 'The AWS region to use'
    required: false
    default: 'us-east-1'
  aws_s3_bucket_name:
    description: 'The name of the S3 bucket to upload the link reference file to'
    required: false
    default: 'elastic-docs-link-index'

runs:
  using: composite
  steps:
    - name: Generate AWS Role ARN
      id: role_arn
      shell: bash
      env:
        AWS_ACCOUNT_ID: ${{ inputs.aws_account_id }}
      run: |
        set -euo pipefail
        prefix="elastic-docs-link-index-uploader-"
        if command -v sha256sum >/dev/null 2>&1; then
          hash="$(printf '%s' "${GITHUB_REPOSITORY}" | sha256sum | awk '{print $1}')"
        else
          hash="$(printf '%s' "${GITHUB_REPOSITORY}" | shasum -a 256 | awk '{print $1}')"
        fi
        hash="${hash:0:$((64 - ${#prefix}))}"
        printf 'result=arn:aws:iam::%s:role/%s%s\n' "${AWS_ACCOUNT_ID}" "${prefix}" "${hash}" >> "${GITHUB_OUTPUT}"
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
      with:
        role-to-assume: ${{ steps.role_arn.outputs.result }}
        aws-region: us-east-1
    - name: Upload Link Reference File to S3
      shell: bash
      env:
        LINK_REFERENCE_FILE: ${{ inputs.link_reference_file }}
        INPUTS_AWS_S3_BUCKET_NAME: ${{ inputs.aws_s3_bucket_name }}
      run: |
        aws s3 cp --checksum-algorithm "SHA256" "${LINK_REFERENCE_FILE}" "s3://${INPUTS_AWS_S3_BUCKET_NAME}/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/links.json"
