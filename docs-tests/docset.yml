project: 'doc-builder-tests'
dev_docs: true
cross_links:
  - docs-content
exclude:
  - '_*.md'
subs:
  a-global-variable: "This was defined in docset.yml"
  serverless-short: Serverless
  ech: "Elastic Cloud Hosted"
  serverless-full: "Elastic Cloud Serverless"
  ecloud: "Elastic Cloud"
  dbuild: "docs-builder"
  kib: "Kibana"
  es: "Elasticsearch"
  fleet: "Fleet"
  fleet-server: "Fleet Server"
  ls: "Logstash"
  stack: "Elastic Stack"
  stack-monitor-app: "Stack Monitoring"
  stack-security-features: "Elastic Stack security features"
  security-features: "Elastic Stack security features"
  package-manager: "Elastic Package Manager"
  agent: "Elastic Agent"
  agents: "Elastic Agents"
  bedrock: "Amazon Bedrock"
  gemini: "Google Gemini"
  ibm-r: "IBM Resilient"
  opsgenie: "Opsgenie"
  sn-itsm: "ServiceNow ITSM"
  sn-sir: "ServiceNow SIR"
  sn-itom: "ServiceNow ITOM"
  swimlane: "Swimlane"
  webhook-cm: "Case Management webhook"
  hosted-ems: "hosted Elastic Maps Service"

features:
  primary-nav: false

suppress:
  - AutolinkElasticCoDocs
  - DeepLinkingVirtualFile

toc:
  - file: index.md
  - file: kibana-settings-yaml-samples.md
  - file: security-settings.md
  - file: req.md
  - folder: nested
    children:
      - file: index.md
  - file: cross-links.md
    children:
      - title: "Getting Started Guide"
        crosslink: docs-content://get-started/introduction.md
  - file: custom-highlighters.md
  - hidden: archive.md
  - hidden: landing-page.md
  - file: nest-under-index/index.md
    children:
      - file: nest-under-index/nested-page-1.md
      - file: nest-under-index/nested-page-2.md
  - folder: mover
    children:
      - file: first-page.md
      - file: second-page.md
  - folder: redirects
    children:
      - file: first-page.md
      - file: second-page.md
      - file: third-page.md
      - file: 5th-page.md
  - folder: deeply-nested
    children:
      - file: index.md
      - file: foo.md
      - file: bar.md
      - folder: baz
        children:
          - file: qux.md
  - folder: release-notes
    children:
      - file: index.md
      - file: highlights.md
      - file: breaking-changes.md
      - file: deprecations.md
      - file: known-issues.md
  - folder: release-notes-all
    children:
      - file: index.md
