    next: main
  ecs-dotnet:
  ecs-logging-go-logrus:
  ecs-logging-go-zap:
  ecs-logging-go-zerolog:
  ecs-logging-java:
  ecs-logging-nodejs:
  ecs-logging-php:
  ecs-logging-python:
  ecs-logging-ruby:
  ecs-logging:
  # CF repos
  edot-cloud-forwarder-aws:
