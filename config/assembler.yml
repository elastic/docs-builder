  edot-cloud-forwarder-azure:
    private: true
  elastic-agent:
  elastic-otel-dotnet:
  elastic-otel-java:
  elastic-otel-node:
  elastic-otel-php:
  elastic-otel-python:
  elastic-otel-rum-js:
  elastic-serverless-forwarder:
  fleet-server:
