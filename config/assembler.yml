environments:
  prod:
    uri: https://www.elastic.co
    path_prefix: docs
    content_source: current # current | next
    allow_indexing: true
    google_tag_manager:
      enabled: true
      id: GTM-KNJMG2M
    optimizely:
      enabled: false
      id: "18132920325"
  staging:
    uri: https://staging-website.elastic.co
    path_prefix: docs
    content_source: next
    google_tag_manager:
      enabled: true
      id: GTM-KNJMG2M
      auth: nPocPUG0wiH68jsVeyRSxA
      preview: env-507
      cookies_win: x
    feature_flags:
      WEBSITE_SEARCH: true
      ASSEMBLER_API_EXPLORER: true
    website_search_url: https://staging-website.elastic.co/search/elastic-website-search.js
  edge:
    uri: https://d34ipnu52o64md.cloudfront.net
    path_prefix: docs
    content_source: edge
    google_tag_manager:
      enabled: false
  # TODO: remove 'local' and switch CI synthetics to use 'dev' explicitly once
  # NAVIGATION_PREVIEW is the default (at which point the pages-dropdown step
  # in navigation-test.journey.ts should be replaced with a top-nav step).
  # 'local' exists solely so the CI synthetics job (assembler build -c local)
  # falls back here instead of 'dev', keeping the flag-off secondary-nav path
  # testable until the flag is retired.
  local:
    uri: http://localhost:4000
    content_source: current
    path_prefix: docs
    feature_flags:
      WEBSITE_SEARCH: true
  dev:
    uri: http://localhost:4000
    content_source: current
    path_prefix: docs
    feature_flags:
      WEBSITE_SEARCH: true
      NAVIGATION_PREVIEW: true
    website_search_url: http://localhost:4078/elastic-website-search.js
  preview:
    uri: https://docs-v3-preview.elastic.dev
    path_prefix: ${ASSEMBLER_PREVIEW_PATH_PREFIX}
    content_source: current
    google_tag_manager:
      enabled: false
    feature_flags:
      NAVIGATION_PREVIEW: true
      ASSEMBLER_API_EXPLORER: true
  air-gapped:
    uri: http://localhost:8080
    path_prefix: docs
    content_source: current
    allow_indexing: false
    feature_flags:
      AIR_GAPPED: true

shared_configuration:
  stack: &stack
    current:  9.5
    next: main
    edge: main

  master: &master
    current: master
    next: master
    edge: master

###
# 'narrative' shares the same keys as keys in 'references' (<repository_config>)
# 'narrative' defines the docs-content repository
###
narrative:
  checkout_strategy: full
  # docs-content is large; give each fetch attempt extra headroom before retrying.
  clone_timeout: 15m

###
# 'references' defines a map of `elastic/<repository_name> * <repository_config>
# repository_config:
#   skip: bool
#   checkout_strategy: full | partial
#             # 'full' git clone --depth-1 --single-branch
#             # 'partial' --cone sparse-checkout of only the 'docs' folder with --filter=blob:none
#   current: <git_ref>
#   next: <git_ref>
#   clone_timeout: <duration>
#             # Per-attempt timeout for network git operations (fetch, pull) in CI.
#             # Accepts a positive integer followed by 's' (seconds) or 'm' (minutes), e.g. '30s' or '15m'.
#             # When omitted the global default of 10m applies in CI (unbounded locally).
###
references:

  # @elastic/ingest-docs
  apm-server:
  apm-agent-android:
  apm-agent-dotnet:
  apm-agent-go:
  apm-agent-ios:
