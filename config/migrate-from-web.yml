# Scope/cutoff list for the TEMPORARY `docs-builder changelog migrate-from-web` command
# (elastic/docs-eng-team#736). Delete this file together with the command once the migration
# rollout (elastic/docs-eng-team#683) completes.
#
# Each entry maps a product id (the `bundle/{product}/` S3 prefix, see config/products.yml) to:
#   owner/repo — the repository whose docs back the published release notes
#   path       — repository-relative path of the release-notes Markdown page
#   ref        — pinned commit SHA at which the Markdown is fetched (reproducible runs)
#   cutoff     — inclusive upper version bound; releases above it are owned by the live pipeline
products:
  edot-java:
    owner: elastic
    repo: elastic-otel-java
    path: docs/release-notes/index.md
    # Last commit before the repo switched to native docs-builder bundle YAMLs (#1023):
    # the final hand-authored state of the published release-notes Markdown.
    ref: 9a61ce4faaf08e272c433a083bcc6f0e96d80e0a
    cutoff: 1.10.0
