# Changelog Configuration — GitHub-release-driven mode
# Bundles are built directly from a GitHub release's notes at publish time.
# No per-PR changelog entries are checked in.
# Run `docs-builder changelog init --mode gh-release` to re-generate this file.

# Bundle configuration
bundle:
  # Input directory (unused in gh-release mode, kept for compatibility)
  directory: docs/changelog
  # Output directory for bundled changelog files
  output_directory: docs/releases
  # changelog-init-bundle-seed
  # PR/issue link allowlist: when set (including []), only links to these owner/repo pairs are kept
  # in bundle output; others are rewritten to '# PRIVATE:' sentinels.
  # Run `changelog init` in a GitHub clone to pre-fill owner, repo, and link_allow_repos, or set
  # bundle.owner, bundle.repo, and link_allow_repos manually. Example:
  # link_allow_repos:
  #   - elastic/my-repo
  # repo: my-repo
  # owner: elastic
