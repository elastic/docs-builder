environments:
  prod:
    uri: https://www.elastic.co
    path_prefix: docs
    content_source: current
    allow_indexing: true
    google_tag_manager:
      enabled: true
      id: x
    optimizely:
      enabled: false
      id: x
    waf_integration_url: https://example.invalid/x.js
  staging:
    uri: https://staging-website.elastic.co
    path_prefix: docs
    content_source: next
    google_tag_manager:
      enabled: true
      id: x
      auth: x
      preview: x
      cookies_win: x
    feature_flags:
      WEBSITE_SEARCH: true
      ASSEMBLER_API_EXPLORER: true
      NAVIGATION_PREVIEW: false
      PAGE_FEEDBACK: true
    website_search_url: https://example.invalid/x.js
    waf_integration_url: https://example.invalid/x.js
  edge:
    uri: https://docs-edge.elastic.dev
    path_prefix: docs
    content_source: edge
    google_tag_manager:
      enabled: false
    feature_flags:
      ASSEMBLER_API_EXPLORER: true
      PAGE_FEEDBACK: true
      NAVIGATION_PREVIEW: false
    waf_integration_url: https://example.invalid/x.js
  demo:
    uri: https://docs-demo.elastic.dev
    path_prefix: docs
    content_source: edge
    google_tag_manager:
      enabled: false
    feature_flags:
      ASSEMBLER_API_EXPLORER: true
      PAGE_FEEDBACK: true
      NAVIGATION_PREVIEW: true
    waf_integration_url: https://example.invalid/x.js
  local:
    uri: http://localhost:4000
    content_source: current
    path_prefix: docs
    feature_flags:
      WEBSITE_SEARCH: true
  dev:
    uri: http://localhost:4000
    content_source: current
    path_prefix: docs
    feature_flags:
      WEBSITE_SEARCH: true
      NAVIGATION_PREVIEW: false
      PAGE_FEEDBACK: true
    website_search_url: https://example.invalid/x.js
  preview:
    uri: https://docs-v3-preview.elastic.dev
    path_prefix: ${ASSEMBLER_PREVIEW_PATH_PREFIX}
    content_source: current
    google_tag_manager:
      enabled: false
    feature_flags:
      ASSEMBLER_API_EXPLORER: true
      PAGE_FEEDBACK: true
  air-gapped:
    uri: http://localhost:8080
    path_prefix: docs
    content_source: current
    allow_indexing: false
    feature_flags:
      AIR_GAPPED: true
      ASSEMBLER_API_EXPLORER: true

