<div class="api-param-section expanded" data-param-section="">
	<h2 class="section-header api-param-section-header" id="authentication" data-section="authentication" aria-label="Authentication">
		<a class="headerlink api-param-section-title" href="#authentication">Authentication</a>
		<button type="button" class="api-param-section-toggle" aria-expanded="true" aria-controls="authentication-list" aria-label="Toggle Authentication">
			<span class="api-param-summary is-variants" data-param-summary="" data-param-more-noun="variant">
				<span class="api-param-summary-list">
					<code class="api-param-summary-item" data-name="Basic + Api key"></code>
					<code class="api-param-summary-item" data-name="Bearer"></code>
				</span>
				<span class="api-param-more" data-param-more="" hidden="">
					<span class="api-param-more-badge" data-param-more-count=""></span>
				</span>
			</span>
			<span class="api-param-chevron" aria-hidden="true"></span>
		</button>
	</h2>
	<div class="api-param-section-body" id="authentication-list">
		<div class="api-tabs api-authentication-tabs">
			<input class="tabs-input" id="authentication-tab-0" name="authentication-tabs" type="radio" checked="checked" tabindex="0">
			<label class="tabs-label" for="authentication-tab-0">Basic + Api key</label>
			<div class="tabs-content api-authorization-panel">
				<p>Send all of these together.</p>
				<h3>Basic</h3>
				<div class="highlight-http notranslate">
					<div class="highlight">
						<pre>
							<code class="language-http">Authorization: Basic &lt;credentials&gt;</code>
						</pre>
					</div>
				</div>
				<h3>Api key</h3>
				<div class="highlight-http notranslate">
					<div class="highlight">
						<pre>
							<code class="language-http">X-Key: &lt;value&gt;</code>
						</pre>
					</div>
				</div>
			</div>
			<input class="tabs-input" id="authentication-tab-1" name="authentication-tabs" type="radio" tabindex="0">
			<label class="tabs-label" for="authentication-tab-1">Bearer</label>
			<div class="tabs-content api-authorization-panel">
				<div class="highlight-http notranslate">
					<div class="highlight">
						<pre>
							<code class="language-http">Authorization: Bearer &lt;token&gt;</code>
						</pre>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
