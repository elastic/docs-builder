<div class="responses-block" data-api-responses="">
	<h2 class="section-header responses-header" id="responses" data-section="responses">
		<a class="headerlink responses-title" href="#responses">Response</a>
	</h2>
	<div class="responses-list">
		<div class="response-panel expanded" data-status="200">
			<div class="response-summary">
				<button type="button" class="response-status-toggle" aria-expanded="true" aria-controls="response-200-fields" aria-describedby="response-200-description">
					<span class="response-status-chip status-success">200</span>
				</button>
				<div class="response-description" id="response-200-description">
					<p>OK</p>
				</div>
				<span class="content-type-tag" data-content-type-current="response-200-content">application/json</span>
				<span class="response-toggle-icon" aria-hidden="true"></span>
			</div>
			<div class="response-panel-body" id="response-200-fields">
				<div class="content-type-panels" id="response-200-content" role="group" aria-label="200 response content types">
					<div class="content-type-picker">
						<label for="response-200-content-select">Content type</label>
						<select id="response-200-content-select" class="content-type-select" data-content-type-select="response-200-content" aria-controls="response-200-content">
							<option value="response-200-content-0" selected="selected">application/json</option>
							<option value="response-200-content-1">application/zip</option>
						</select>
					</div>
					<div class="content-type-panel" id="response-200-content-0">
						<p>Response Type:
							<code class="schema-type">
								<span data-tippy-content="">object</span>
							</code>
						</p>
					</div>
					<div class="content-type-panel" id="response-200-content-1" hidden="until-found">
						<p>Response Type:
							<code class="schema-type">
								<span data-tippy-content="">string(binary)</span>
							</code>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
