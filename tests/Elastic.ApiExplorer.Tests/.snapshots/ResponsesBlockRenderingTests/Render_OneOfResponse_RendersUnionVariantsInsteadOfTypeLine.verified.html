<div class="responses-block" data-api-responses="">
	<h2 class="section-header responses-header" id="responses" data-section="responses">
		<a class="headerlink responses-title" href="#responses">Response</a>
	</h2>
	<div class="responses-list">
		<div class="response-panel expanded" data-status="400">
			<div class="response-summary">
				<button type="button" class="response-status-toggle" aria-expanded="true" aria-controls="response-400-fields" aria-describedby="response-400-description">
					<span class="response-status-chip status-error">400</span>
				</button>
				<div class="response-description" id="response-400-description">
					<p>Invalid input data response</p>
				</div>
				<span class="content-type-tag">application/json</span>
				<span class="response-toggle-icon" aria-hidden="true"></span>
			</div>
			<div class="response-panel-body" id="response-400-fields">
				<div class="union-variants-container union-variant-chips" id="res-400-union-options">
					<div class="api-example-chips-row union-chips-row" data-chip-row="">
						<div class="api-example-chips" role="tablist" aria-label="Variants">
							<button type="button" role="tab" class="api-example-chip is-active" data-chip="res-400-variant-platform" aria-controls="res-400-variant-platform" aria-selected="true" title="PlatformErrorResponse">
								<span class="api-example-chip-title" data-chip-title="">Platform</span>
							</button>
							<button type="button" role="tab" class="api-example-chip" data-chip="res-400-variant-siem" aria-controls="res-400-variant-siem" aria-selected="false" tabindex="-1" title="SiemErrorResponse">
								<span class="api-example-chip-title" data-chip-title="">Siem</span>
							</button>
						</div>
						<button type="button" class="api-example-more" data-chip-more="" aria-haspopup="menu" aria-expanded="false" aria-controls="res-400-union-options-menu" popovertarget="res-400-union-options-menu" hidden="">
							<span data-chip-more-label=""></span>
							<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true">
								<use href="#icon-chevron-down"></use>
							</svg>
						</button>
						<div id="res-400-union-options-menu" class="api-example-menu simple-scrollbar" popover="auto" data-chip-menu="">
							<div role="menu" aria-label="More variants">
								<button type="button" role="menuitem" class="api-example-menu-item" data-chip="res-400-variant-platform" title="PlatformErrorResponse" hidden="">
									<span class="api-example-menu-item-title" data-chip-item-title="">Platform</span>
								</button>
								<button type="button" role="menuitem" class="api-example-menu-item" data-chip="res-400-variant-siem" title="SiemErrorResponse" hidden="">
									<span class="api-example-menu-item-title" data-chip-item-title="">Siem</span>
								</button>
							</div>
						</div>
					</div>
					<div class="union-variants">
						<div class="union-variant-item  " id="res-400-variant-platform">
						</div>
						<div class="union-variant-item  " id="res-400-variant-siem" hidden="until-found">
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
