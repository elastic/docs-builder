<div class="content-type-panels" id="request-body-content" role="group" aria-label="Request body content types">
	<div class="content-type-picker">
		<label for="request-body-content-select">Content type</label>
		<select id="request-body-content-select" class="content-type-select" data-content-type-select="request-body-content" aria-controls="request-body-content">
			<option value="request-body-content-0" selected="selected">application/gzip; application/zip</option>
			<option value="request-body-content-1">application/gzip</option>
		</select>
	</div>
	<div class="content-type-panel" id="request-body-content-0">
		<p>Type:
			<code class="schema-type">
				<span class="type-primitive" data-tippy-content="">string</span>
				<span class="schema-type-group">
					<span class="schema-type-sep">
						·
					</span>
					<span class="type-constraint" data-tippy-content="">format: binary</span>
				</span>
			</code>
		</p>
	</div>
	<div class="content-type-panel" id="request-body-content-1" hidden="until-found">
		<p class="content-type-empty">No schema is declared for this content type.</p>
	</div>
</div>
