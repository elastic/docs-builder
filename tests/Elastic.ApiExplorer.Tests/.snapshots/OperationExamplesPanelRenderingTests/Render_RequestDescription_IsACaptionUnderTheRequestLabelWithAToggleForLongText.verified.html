<div class="api-rail-request" data-rail-request="">
	<div class="api-code-carousel" data-api-carousel="">
		<div class="api-code-carousel-head">
			<span class="api-rail-label">Request</span>
			<span class="api-code-carousel-position" data-carousel-position="" aria-live="polite">
				<strong>Console</strong>
				<span>1 / 4 languages</span>
			</span>
			<button type="button" class="api-code-carousel-arrow" data-carousel-step="-1" aria-label="Previous language" disabled="">‹</button>
			<button type="button" class="api-code-carousel-arrow" data-carousel-step="1" aria-label="Next language">›</button>
		</div>
		<div class="api-example-caption" data-example-description="">
			<div class="api-example-caption-text">
				<p>Splits the search into slices.</p>
			</div>
			<button type="button" class="api-example-caption-toggle" data-description-toggle="" aria-expanded="false" hidden="">Show more</button>
		</div>
		
		<div class="api-code-carousel-dots" role="group" aria-label="Languages">
			<button type="button" class="api-code-carousel-dot is-active" data-carousel-dot="Console" aria-label="Console" data-tippy-content="Console" aria-current="true">
				<span class="api-lang-badge" data-lang="Console" aria-hidden="true"></span>
			</button>
			<button type="button" class="api-code-carousel-dot" data-carousel-dot="curl" aria-label="curl" data-tippy-content="curl" aria-current="false">
				<span class="api-lang-badge" data-lang="curl" aria-hidden="true"></span>
			</button>
			<button type="button" class="api-code-carousel-dot" data-carousel-dot="Python" aria-label="Python" data-tippy-content="Python" aria-current="false">
				<span class="api-lang-badge" data-lang="Python" aria-hidden="true"></span>
			</button>
			<button type="button" class="api-code-carousel-dot" data-carousel-dot="Java" aria-label="Java" data-tippy-content="Java" aria-current="false">
				<span class="api-lang-badge" data-lang="Java" aria-hidden="true"></span>
			</button>
		</div>
	</div>
</div>
<div class="api-rail-response">
	<div class="api-code-carousel-head">
		<span class="api-rail-label">Response</span>
	</div>
	<div class="api-code-card example-block example-block--response" data-api-response-samples="" data-code-card="">
		<div class="example-block-header">
			<div class="example-response-tabs" role="tablist" aria-label="Response status">
				<button type="button" role="tab" class="example-response-tab is-active" data-status="200" aria-selected="true" tabindex="0" data-tippy-content="">
					<span class="example-response-tab-label">200</span>
				</button>
			</div>
			<div class="example-block-actions" data-code-actions=""></div>
		</div>
		<div class="example-block-body">
			<div class="example-response-panel" data-status="200" data-code-panel="200" role="tabpanel">
				<div class="example-media-body">
					<div class="highlight-json notranslate" data-line-numbers="">
						<div class="highlight">
							<div class="code-lines">
								<div class="code-line-gutter" aria-hidden="true">1</div>
								<pre><code class="language-json">{}</code></pre>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
