<h2 id="apikey">Api key</h2>
<div class="highlight-http notranslate">
	<div class="highlight">
		<pre><code class="language-http">Authorization: &lt;value&gt;</code></pre>
	</div>
</div>
<p>Send the encoded key with the ApiKey prefix.</p>
<h2 id="basicauth">Basic</h2>
<div class="highlight-http notranslate">
	<div class="highlight">
		<pre><code class="language-http">Authorization: Basic &lt;credentials&gt;</code></pre>
	</div>
</div>
<h2 id="bearerauth">Bearer</h2>
<div class="highlight-http notranslate">
	<div class="highlight">
		<pre><code class="language-http">Authorization: Bearer &lt;token&gt;</code></pre>
	</div>
</div>
