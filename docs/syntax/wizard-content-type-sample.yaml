# A second sample, to show {wizard} isn't only for deployments: "Which type of page should I write?"
# One variable, no scoring, and a single fallback button.

meta:
  title: Which type of page should I write?
  intro: Answer two quick questions and we'll point you to the right content type.
  start_button: Find my content type
  start: purpose
  progress_label: Your progress

screens:
  purpose:
    type: question
    progress: 30
    question: What does the reader need?
    why: The reader's goal decides the content type, not the topic.
    options:
      - label: To understand what something is
        set: { type: overview }
        next: done
      - label: To get something done
        set: { work: task }
        next: scope
      - label: To fix a problem
        set: { type: troubleshooting }
        next: done
      - label: To see what changed
        set: { type: changelog }
        next: done

  scope:
    type: question
    progress: 70
    question: How big is the job?
    why: A single task is a how-to. A whole scenario with a story is a tutorial.
    options:
      - label: One focused task
        hint: For example, "Create an API key"
        set: { type: how-to }
        next: done
      - label: A full scenario from start to finish
        hint: For example, "Build a search app from scratch"
        set: { type: tutorial }
        next: done

  done:
    type: result
    progress: 100

results:
  heading: Write {type}
  variables:
    type:
      answer: type
      items:
        overview:
          name: an overview
          blurb: Explains what something is, why it matters and how it fits together.
          docs: { title: Overview guidelines, href: "https://www.elastic.co/docs/contribute-docs/content-types/overviews" }
        how-to:
          name: a how-to guide
          blurb: Gives the steps to complete one specific task.
          docs: { title: How-to guidelines, href: "https://www.elastic.co/docs/contribute-docs/content-types/how-tos" }
        tutorial:
          name: a tutorial
          blurb: Walks the reader through a complete scenario with a clear outcome.
          docs: { title: Tutorial guidelines, href: "https://www.elastic.co/docs/contribute-docs/content-types/tutorials" }
        troubleshooting:
          name: a troubleshooting page
          blurb: Helps the reader diagnose and fix a known problem.
          docs: { title: Troubleshooting guidelines, href: "https://www.elastic.co/docs/contribute-docs/content-types/troubleshooting" }
        changelog:
          name: a changelog
          blurb: Lists what changed between versions.
          docs: { title: Changelog guidelines, href: "https://www.elastic.co/docs/contribute-docs/content-types/changelogs" }
  cta:
    - label: Read the guidelines for {type}
      href_from: type
