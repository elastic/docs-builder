  - '_*.md'
subs:
  a-global-variable: "This was defined in docset.yml"
  serverless-short: Serverless
  ech: "Elastic Cloud Hosted"
  serverless-full: "Elastic Cloud Serverless"
  ecloud: "Elastic Cloud"
  dbuild: "docs-builder"
  kib: "Kibana"
  es: "Elasticsearch"
  fleet: "Fleet"
  fleet-server: "Fleet Server"
  ls: "Logstash"
  stack: "Elastic Stack"
  stack-monitor-app: "Stack Monitoring"
  stack-security-features: "Elastic Stack security features"
  security-features: "Elastic Stack security features"
  package-manager: "Elastic Package Manager"
  agent: "Elastic Agent"
  agents: "Elastic Agents"
  bedrock: "Amazon Bedrock"
  gemini: "Google Gemini"
  ibm-r: "IBM Resilient"
  opsgenie: "Opsgenie"
  sn-itsm: "ServiceNow ITSM"
  sn-sir: "ServiceNow SIR"
  sn-itom: "ServiceNow ITOM"
  swimlane: "Swimlane"
  webhook-cm: "Case Management webhook"
  hosted-ems: "hosted Elastic Maps Service"

features:
  primary-nav: false

# Local fixture for ApiExplorer and supplemental files. The URL key must not collide
# with docs-content's `elasticsearch` key: assembler preview still builds this checkout
# even though the repo is `skip: true` in assembler.yml.
# `repository:` matches the version-index publisher; without it, lookup uses this
# checkout (`elastic/docs-builder`) and `--strict` fails. Isolated serve (no
# `--watch`): /api/doc/docs-builder-elasticsearch/
api:
  docs-builder-elasticsearch:
    - spec: elasticsearch.json
      product: elasticsearch
      repository: elastic/elasticsearch-specification

cta:
  docs-builder:
    button:
      label: Star docs-builder on GitHub
      url: https://github.com/elastic/docs-builder
    benefits:
      - "Open source"
      - "Built with .NET"
      - "Contributions welcome"

suppress:
  - AutolinkElasticCoDocs
  - DeepLinkingVirtualFile

