# Local modes, one set of conventions (use ./dev.sh, not these services directly):
#
#   mode      service    host port  build output volume   clone volume
#   isolated  serve      3000       serve-artifacts       -
#   assembler assembler  4000       assembler-artifacts   assembler-data
#   codex     codex      4001       codex-artifacts       codex-data
#
# All three run from source in docs-builder:tooling and share the environment
# below, so a default such as a feature flag is set once.
x-cli: &cli
  image: docs-builder:tooling
  working_dir: /src
  environment: &cli-env
    DOCS_BUILDER_BIND_ADDRESS: 0.0.0.0
    DOTNET_USE_POLLING_FILE_WATCHER: "1"
    # Feature flag defaults for every local mode. The default `dev` environment
    # leaves the API Explorer off, so the assembler's /docs/api/ would 404. Set
    # FEATURE_ASSEMBLER_API_EXPLORER=false to skip it and build faster.
    FEATURE_ASSEMBLER_API_EXPLORER: ${FEATURE_ASSEMBLER_API_EXPLORER:-true}
    # dev.sh sets these to rewrite the git@github.com: origins the CLI builds
    # into HTTPS URLs, because the image has no ssh client.
    GIT_CONFIG_COUNT: ${GIT_CONFIG_COUNT:-0}
    GIT_CONFIG_KEY_0: ${GIT_CONFIG_KEY_0:-}
    GIT_CONFIG_VALUE_0: ${GIT_CONFIG_VALUE_0:-}
    GIT_TERMINAL_PROMPT: "0"

services:
  # Run a one-shot CLI command, for example:
  #   ./dev.sh docs
  #   docker compose run --rm docs-builder inbound-links validate-link-reference
  docs-builder:
    image: docs-builder:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - build-artifacts:/workspace/.artifacts

  # Run the repository's unit-test suite without installing the .NET SDK on
  # the host machine. Build the image with `./dev.sh build` first.
  #
  # .artifacts/ is mounted as a named volume so dotnet build/test never
  # writes root-owned bin/, obj/, or TestResults/ into the host checkout.
  # All .NET outputs go there via UseArtifactsOutput in Directory.Build.props.
  tests:
    image: docs-builder:tooling
    working_dir: /workspace/docs-builder
    command: ["./build.sh", "unit-test"]
    volumes:
      - .:/workspace/docs-builder
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm
      - test-artifacts:/workspace/docs-builder/.artifacts

  # Run the development server with dotnet watch. Code changes restart the
  # CLI, while Markdown and static-file changes use the existing live reload.
  # Start with `./dev.sh serve` and open http://localhost:3000.
  #
  # .artifacts/ and node_modules are mounted as named volumes so dotnet watch
  # and npm ci never write root-owned files into the host checkout. The
  # npm-cache volume retains downloaded packages so reinstalls after a
  # lockfile change are fast.
  serve:
    <<: *cli
    entrypoint: ["sh", "build/dev/serve-entrypoint.sh"]
    environment:
      <<: *cli-env
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
      # API page regeneration allocates heavily on every core; workstation GC
      # throttled it to a few cores (about 10 s per regeneration vs 3-4 s).
      # The runtime matches this name case-sensitively: DOTNET_GCSERVER is ignored.
      DOTNET_gcServer: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/src
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm
      - node-modules:/src/src/Elastic.Documentation.Site/node_modules
      - serve-artifacts:/src/.artifacts

  # Run assembler and codex commands from source with `dotnet run`, so local
  # code changes apply without an AOT publish. Use the `./dev.sh assembler*`
  # and `./dev.sh codex*` commands rather than calling these directly.
  #
  # Build output lives in the named .artifacts volumes and clones in the *-data
  # volumes (the CLI clones to ~/.local/share/elastic/docs-builder/checkouts),
  # not the host checkout, so no root-owned files appear in the working tree. Both
  # serve static output on container port 4000; the host ports differ so the
  # two sites can run side by side.
  assembler:
    <<: *cli
    entrypoint: ["dotnet", "run", "--project", "src/tooling/docs-builder", "--configuration", "debug", "--"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - .:/src
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm
      - node-modules:/src/src/Elastic.Documentation.Site/node_modules
      - assembler-artifacts:/src/.artifacts
      - assembler-data:/root/.local/share/elastic/docs-builder

  codex:
    <<: *cli
    entrypoint: ["dotnet", "run", "--project", "src/tooling/docs-builder", "--configuration", "debug", "--"]
    ports:
      - "127.0.0.1:4001:4000"
    volumes:
      - .:/src
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm
      - node-modules:/src/src/Elastic.Documentation.Site/node_modules
      - codex-artifacts:/src/.artifacts
      - codex-data:/root/.local/share/elastic/docs-builder

  # Run the docs API locally. Start with `./dev.sh serve-api` and connect
  # an API client to http://localhost:8081.
  api:
    image: docs-builder:api
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    volumes:
      - api-artifacts:/app/.artifacts

  # Run the MCP server locally. Start with `./dev.sh serve-mcp` and connect
  # an MCP client to http://localhost:8080/docs/_mcp.
  #
  # Pass MCP_SERVER_PROFILE=internal to switch to the internal docs profile.
  mcp:
    image: docs-builder:mcp
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      MCP_SERVER_PROFILE: ${MCP_SERVER_PROFILE:-public}
    volumes:
      - mcp-artifacts:/app/.artifacts

volumes:
  npm-cache:
  nuget-packages:
  node-modules:
  test-artifacts:
  serve-artifacts:
  assembler-artifacts:
  codex-artifacts:
  assembler-data:
  codex-data:
  build-artifacts:
  api-artifacts:
  mcp-artifacts:
