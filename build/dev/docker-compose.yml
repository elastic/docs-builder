services:
  # Run a one-shot CLI command, for example:
  #   ./dev.sh docs
  #   docker compose run --rm docs-builder inbound-links validate-link-reference
  docs-builder:
    image: docs-builder:local
    working_dir: /workspace
    volumes:
      - .:/workspace

  # Run the repository's unit-test suite without installing the .NET SDK on
  # the host machine. Build the image with `./dev.sh build` first.
  tests:
    image: docs-builder:tooling
    working_dir: /workspace/docs-builder
    command: ["./build.sh", "unit-test"]
    volumes:
      - .:/workspace/docs-builder
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm

  # Run the development server with dotnet watch. Code changes restart the
  # CLI, while Markdown and static-file changes use the existing live reload.
  # Start with `./dev.sh serve` and open http://localhost:3000.
  #
  # node_modules is mounted as a named volume so npm ci never writes
  # root-owned files into the host checkout. The npm-cache volume retains
  # downloaded packages so reinstalls after a lockfile change are fast.
  serve:
    image: docs-builder:tooling
    working_dir: /src
    entrypoint: ["sh", "build/dev/serve-entrypoint.sh"]
    environment:
      DOCS_BUILDER_BIND_ADDRESS: 0.0.0.0
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_LAUNCH_BROWSER: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/src
      - nuget-packages:/root/.nuget/packages
      - npm-cache:/root/.npm
      - node-modules:/src/src/Elastic.Documentation.Site/node_modules

volumes:
  npm-cache:
  nuget-packages:
  node-modules:
