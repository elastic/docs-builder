# One entry point for the toolchain: `mise install` provisions the SDKs, `mise tasks` lists what you can run.
# Versions are not pinned here: mise reads global.json (.NET SDK) and .nvmrc (Node), which CI and the
# Dockerfiles also read, so each version has a single source.

[settings]
idiomatic_version_file_enable_tools = ["dotnet", "node"]

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"

# `mise install` only provisions the SDKs. The local tools in dotnet-tools.json (husky, curb, minver, ...)
# are restored here, and the git hooks wired, so a fresh clone or worktree is ready after one command.
[hooks]
postinstall = "dotnet tool restore && dotnet husky install"

# ---- setup ----

[tasks.setup]
description = "Restore the local dotnet tools, wire the git hooks, install the frontend dependencies"
depends = ["setup:tools", "site:install"]

[tasks."setup:tools"]
description = "Restore dotnet-tools.json and install the husky git hooks"
run = ["dotnet tool restore", "dotnet husky install"]

# ---- build, test, format ----
# These go through the F# build project, the same thing build.sh runs, so the logic lives in one place.

[tasks.build]
description = "Build the solution"
run = "dotnet build"

[tasks.test]
description = "Unit tests (fast). Extra args pass through, e.g. -- --test-parallelism=4"
run = "dotnet run --project build -c release -- unit-test"

[tasks.integrate]
description = "Integration tests (slow, clones real repositories)"
run = "dotnet run --project build -c release -- integrate"

[tasks."journeys:test"]
description = "TUnit journey tests: starts docs/ as an isolated site and compares each journey with its verified transcript. Live journeys are skipped (see journeys:live). Extra args pass to dotnet test, e.g. -- --treenode-filter /*/*/NavigationJourneys/*"
run = "dotnet test --project tests/Elastic.Documentation.Journeys.Tests"

[tasks."journeys:test:assembler"]
description = "TUnit journey tests against the output of `docs-builder assembler build` (.artifacts/assembly); the isolated-site journeys are skipped until the assembler site has its own"
env = { JOURNEY_TARGET = "assembler" }
run = "dotnet test --project tests/Elastic.Documentation.Journeys.Tests"

[tasks."journeys:test:codex"]
description = "TUnit journey tests against the output of `docs-builder codex build` (.artifacts/codex/docs); the isolated-site journeys are skipped until the Codex site has its own"
env = { JOURNEY_TARGET = "codex" }
run = "dotnet test --project tests/Elastic.Documentation.Journeys.Tests"

[tasks."journeys:local"]
description = "docs-journeys against docs/ served by this task (the isolated site): same output as journeys:live, checks the expect lines, compares no transcripts. Extra args pass to docs-journeys run, e.g. mise run journeys:local --only landing/home --screenshot-on-failure"
usage = '''
arg "[args]..." var=#true help="Passed to docs-journeys run"
'''
run = '''
#!/usr/bin/env bash
set -eu
build=$(dotnet build src/tooling/docs-builder -nologo -v q -clp:NoSummary 2>&1) || { echo "$build"; exit 1; }
dll="$PWD/.artifacts/bin/docs-builder/debug/docs-builder.dll"
# A port nothing listens on, so the readiness check cannot be answered by another server.
while :; do
  port=$(( (RANDOM % 20000) + 20000 ))
  nc -z localhost "$port" 2>/dev/null || break
done
# A flag exported in the shell must not change what the journeys see.
for name in $(env | sed -n 's/^\(FEATURE_[A-Za-z0-9_]*\)=.*/\1/p'); do unset "$name"; done
(cd docs && exec dotnet "$dll" serve --port "$port" --no-hud >/dev/null 2>&1) &
server=$!
trap 'kill "$server" 2>/dev/null || true; wait "$server" 2>/dev/null || true' EXIT
for _ in $(seq 1 240); do
  kill -0 "$server" 2>/dev/null || { echo "docs-builder exited before it served http://localhost:$port/" >&2; exit 1; }
  curl -fs -o /dev/null "http://localhost:$port/" && break
  sleep 0.5
done
kill -0 "$server" 2>/dev/null && curl -fs -o /dev/null "http://localhost:$port/" || { echo "http://localhost:$port/ did not answer within 120 s" >&2; exit 1; }
# mise shell-quotes the variadic args; eval restores the word boundaries.
extra=()
eval "extra=(${usage_args:-})"
dotnet run --project src/tooling/docs-journeys -- run --url "http://localhost:$port" --journeys tests/Elastic.Documentation.Journeys.Tests/journeys ${extra[@]+"${extra[@]}"}
'''

[tasks."journeys:live"]
description = "docs-journeys against a deployed site (prod, edge or demo, default demo): read-only, checks the expect lines, compares no transcripts. Extra args pass to docs-journeys run, e.g. mise run journeys:live prod --only navigation/main-paths"
usage = '''
arg "[site]" default="demo" help="prod, edge, demo or local"
arg "[args]..." var=#true help="Passed to docs-journeys run"
'''
run = "dotnet run --project src/tooling/docs-journeys -- run --url ${usage_site} --journeys tests/Elastic.Documentation.Journeys.Tests/journeys ${usage_args:-}"

[tasks."snap:status"]
description = "List snapshots a test run left to review (received files). Exits 1 when there are any"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap status"
'''
run = 'eval "dotnet snap status ${usage_args:-}"'

[tasks."snap:diff"]
description = "Show how a received snapshot differs from its verified file. Takes a key from snap:status, a unique suffix of one, or a glob"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap diff"
'''
run = 'eval "dotnet snap diff ${usage_args:-}"'

[tasks."snap:review"]
description = "Review pending snapshots one by one: see each diff, then accept, reject or skip it"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap review"
'''
run = 'eval "dotnet snap review ${usage_args:-}"'

[tasks."snap:accept"]
description = "Accept received snapshots as verified: keys, unique suffixes or globs, or --all. Read the diff first. Never in CI"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap accept"
'''
run = 'eval "dotnet snap accept ${usage_args:-}"'

[tasks."snap:reject"]
description = "Reject received snapshots: delete the received files and keep the verified ones. Keys, unique suffixes or globs, or --all"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap reject"
'''
run = 'eval "dotnet snap reject ${usage_args:-}"'

[tasks."snap:orphans"]
description = "List verified snapshots the latest full run of mise run test did not use (run the whole suite first); --delete removes them. Exits 1 when there are any"
usage = '''
arg "[args]..." var=#true help="Passed to dotnet snap orphans"
'''
run = 'eval "dotnet snap orphans ${usage_args:-}"'

[tasks.lint]
description = "C# format check (curb, read-only)"
run = "dotnet run --project build -c release -- lint"

[tasks.fmt]
description = "Auto-fix C# formatting"
run = "dotnet run --project build -c release -- format"

[tasks.clean]
description = "Remove build output and .artifacts/"
run = "dotnet run --project build -c release -- clean"

[tasks.version]
description = "Print the computed version"
run = "dotnet run --project build -c release -- version"

[tasks.release]
description = "Build, test, and package everything short of publishing"
run = "dotnet run --project build -c release -- release"

[tasks.publish]
description = "Publish the artifacts"
run = "dotnet run --project build -c release -- publish"

[tasks.schema]
description = "Regenerate docs/cli-schema.json after changing docs-builder commands"
run = "dotnet run --project src/tooling/docs-builder -- __schema > docs/cli-schema.json"

# ---- run ----

[tasks.serve]
description = "Serve docs/ with live reload"
run = "dotnet run --project src/tooling/docs-builder -- serve"

[tasks.watch]
description = "dotnet watch: rebuild code, templates and web assets on the fly"
run = "dotnet run --project build -c release -- watch"

# ---- frontend (src/Elastic.Documentation.Site) ----

[tasks."site:install"]
description = "npm ci for the frontend"
dir = "src/Elastic.Documentation.Site"
sources = ["package-lock.json"]
outputs = ["node_modules/.package-lock.json"]
run = "npm ci"

[tasks."site:build"]
description = "Production frontend build"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run build"

[tasks."site:watch"]
description = "Frontend dev build with live reload"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run watch"

[tasks."site:test"]
description = "Frontend tests (Vitest)"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run test"

[tasks."site:lint"]
description = "Frontend lint (ESLint)"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run lint"

[tasks."site:fmt"]
description = "Frontend auto-format (Prettier)"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run fmt:write"

[tasks."site:check"]
description = "Frontend TypeScript type check"
depends = ["site:install"]
dir = "src/Elastic.Documentation.Site"
run = "npm run compile:check"
